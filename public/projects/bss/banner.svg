<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#022C22"/>
      <stop offset="100%" style="stop-color:#14532D"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Banner mockup wide -->
  <rect x="60" y="80" width="1080" height="300" rx="20" fill="#011C16" stroke="#10B981" stroke-width="2"/>
  <!-- Left decoration -->
  <circle cx="200" cy="230" r="100" fill="#10B981" opacity="0.15"/>
  <circle cx="200" cy="230" r="70" fill="#10B981" opacity="0.1"/>
  <text x="200" y="246" font-family="system-ui, sans-serif" font-size="60" text-anchor="middle">🌙</text>
  <!-- Center content -->
  <text x="600" y="170" font-family="system-ui, sans-serif" font-size="15" fill="#34D399" text-anchor="middle" letter-spacing="6">BANGLADESH STUDENT SOCIETY · UNB</text>
  <text x="600" y="225" font-family="system-ui, sans-serif" font-size="52" font-weight="900" fill="white" text-anchor="middle">EID CELEBRATION</text>
  <text x="600" y="268" font-family="system-ui, sans-serif" font-size="28" fill="#34D399" text-anchor="middle">2024</text>
  <rect x="360" y="285" width="480" height="3" rx="2" fill="url(#green)" opacity="0.8"/>
  <text x="600" y="340" font-family="system-ui, sans-serif" font-size="16" fill="#A7F3D0" text-anchor="middle">Saturday, April 20, 2024 · UNB Marshall d'Avray Hall · 6:00 PM</text>
  <!-- Right decoration -->
  <circle cx="1000" cy="230" r="100" fill="#10B981" opacity="0.15"/>
  <circle cx="1000" cy="230" r="70" fill="#10B981" opacity="0.1"/>
  <text x="1000" y="246" font-family="system-ui, sans-serif" font-size="60" text-anchor="middle">⭐</text>
  <!-- Smaller banner mockup -->
  <rect x="60" y="430" width="520" height="160" rx="16" fill="#011C16" stroke="#34D399" stroke-width="1.5"/>
  <rect x="80" y="450" width="100" height="100" rx="12" fill="#10B981" opacity="0.4"/>
  <text x="130" y="508" font-family="system-ui, sans-serif" font-size="36" text-anchor="middle">🎭</text>
  <text x="380" y="490" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">Cultural Night</text>
  <text x="380" y="518" font-family="system-ui, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">March 15, 2024 · Student Centre</text>
  <rect x="300" y="540" width="140" height="28" rx="14" fill="#10B981"/>
  <text x="370" y="559" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">REGISTER FREE</text>
  <!-- Second smaller banner -->
  <rect x="620" y="430" width="520" height="160" rx="16" fill="#011C16" stroke="#10B981" stroke-width="1.5"/>
  <rect x="640" y="450" width="100" height="100" rx="12" fill="#34D399" opacity="0.3"/>
  <text x="690" y="508" font-family="system-ui, sans-serif" font-size="36" text-anchor="middle">🍛</text>
  <text x="930" y="490" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="white" text-anchor="middle">Annual Dinner</text>
  <text x="930" y="518" font-family="system-ui, sans-serif" font-size="14" fill="#34D399" text-anchor="middle">April 20, 2024 · d'Avray Hall</text>
  <rect x="858" y="540" width="140" height="28" rx="14" fill="#10B981"/>
  <text x="928" y="559" font-family="system-ui, sans-serif" font-size="12" fill="white" text-anchor="middle">GET YOUR TICKET</text>
  <!-- Label -->
  <text x="600" y="668" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="white" text-anchor="middle">Event Banners</text>
  <text x="600" y="700" font-family="system-ui, sans-serif" font-size="15" fill="#34D399" text-anchor="middle">Web · Print · Social Formats</text>
