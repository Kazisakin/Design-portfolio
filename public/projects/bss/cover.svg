  <rect x="160" y="80" width="360" height="120" rx="16" fill="#10B981" opacity="0.7"/>
  <text x="340" y="130" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="white" text-anchor="middle">BSS PRESENTS</text>
  <text x="340" y="158" font-family="system-ui, sans-serif" font-size="14" fill="#D1FAE5" text-anchor="middle">Bangladesh Student Society · UNB</text>
