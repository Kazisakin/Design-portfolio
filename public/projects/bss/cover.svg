  <!-- Title -->
  <text x="600" y="626" font-family="system-ui, sans-serif" font-size="44" font-weight="700" fill="white" text-anchor="middle">BSS Event Visuals</text>
  <text x="600" y="663" font-family="system-ui, sans-serif" font-size="18" fill="#34D399" text-anchor="middle">Posters · Banners · Social Media · Invitations</text>
  <rect x="460" y="680" width="280" height="3" rx="2" fill="url(#green)" opacity="0.8"/>
  <rect x="528" y="702" width="144" height="30" rx="15" fill="#064E3B" opacity="0.9"/>
  <text x="600" y="722" font-family="system-ui, sans-serif" font-size="13" fill="#6EE7B7" text-anchor="middle">Branding · 2024</text>
