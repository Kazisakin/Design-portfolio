  <text x="340" y="466" font-family="system-ui, sans-serif" font-size="13" fill="#6EE7B7" text-anchor="middle">7:00 PM — 11:00 PM</text>
  <rect x="250" y="498" width="180" height="38" rx="19" fill="#10B981"/>
  <text x="340" y="522" font-family="system-ui, sans-serif" font-size="14" fill="white" text-anchor="middle" font-weight="600">REGISTER NOW</text>
  <!-- Banner mockup -->
  <rect x="580" y="80" width="460" height="180" rx="16" fill="#022C22" stroke="#10B981" stroke-width="2"/>
