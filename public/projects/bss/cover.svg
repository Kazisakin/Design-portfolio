  <text x="810" y="145" font-family="system-ui, sans-serif" font-size="36" font-weight="800" fill="white" text-anchor="middle">EID MUBARAK</text>
  <text x="810" y="178" font-family="system-ui, sans-serif" font-size="16" fill="#34D399" text-anchor="middle">Bangladesh Student Society — UNB</text>
  <text x="810" y="235" font-family="system-ui, sans-serif" font-size="30" text-anchor="middle">🌙</text>
  <!-- Social card mockup -->
  <rect x="580" y="320" width="220" height="220" rx="16" fill="#022C22" stroke="#10B981" stroke-width="1.5"/>
  <rect x="580" y="320" width="220" height="220" rx="16" fill="#10B981" opacity="0.12"/>
  <text x="690" y="420" font-family="system-ui, sans-serif" font-size="48" text-anchor="middle">🎭</text>
  <rect x="600" y="450" width="180" height="12" rx="4" fill="white" opacity="0.8"/>
  <rect x="610" y="470" width="140" height="10" rx="3" fill="#34D399" opacity="0.7"/>
  <rect x="610" y="488" width="100" height="10" rx="3" fill="#6EE7B7" opacity="0.5"/>
  <!-- Invitation card mockup -->
  <rect x="820" y="320" width="220" height="220" rx="16" fill="#022C22" stroke="#34D399" stroke-width="1.5"/>
  <rect x="820" y="320" width="220" height="100" rx="16" fill="#10B981" opacity="0.5"/>
  <text x="930" y="378" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="white" text-anchor="middle">YOU'RE INVITED</text>
  <text x="930" y="456" font-family="system-ui, sans-serif" font-size="13" fill="#D1FAE5" text-anchor="middle">Annual Dinner 2024</text>
  <text x="930" y="478" font-family="system-ui, sans-serif" font-size="12" fill="#A7F3D0" text-anchor="middle">April 20 · 6PM</text>
