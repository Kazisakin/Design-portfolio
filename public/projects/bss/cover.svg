      <stop offset="0%" style="stop-color:#022C22"/>
      <stop offset="100%" style="stop-color:#14532D"/>
    </linearGradient>
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Decorative pattern -->
  <circle cx="150" cy="150" r="120" fill="#10B981" opacity="0.08"/>
  <circle cx="1050" cy="650" r="150" fill="#10B981" opacity="0.08"/>
  <!-- Event poster mockup -->
  <rect x="160" y="80" width="360" height="500" rx="16" fill="#022C22" stroke="#10B981" stroke-width="2"/>
