<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="100%" style="stop-color:#1A0E00"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#F97316"/>
      <stop offset="100%" style="stop-color:#FBBF24"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="800" fill="url(#bg)"/>
  <!-- Play button / video frame -->
  <rect x="300" y="120" width="600" height="380" rx="20" fill="#111" stroke="#F97316" stroke-width="2"/>
  <!-- Film strip top -->
  <rect x="300" y="120" width="600" height="30" rx="20" fill="#1A1A1A"/>
  <rect x="320" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="360" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="400" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="440" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="480" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="520" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="560" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="600" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="640" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="680" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="720" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="760" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="800" y="127" width="30" height="16" rx="3" fill="#333"/>
  <rect x="840" y="127" width="30" height="16" rx="3" fill="#333"/>
  <!-- Waveform lines -->
  <line x1="330" y1="290" x2="330" y2="360" stroke="#F97316" stroke-width="3" opacity="0.8"/>
  <line x1="350" y1="270" x2="350" y2="380" stroke="#F97316" stroke-width="3" opacity="0.9"/>
  <line x1="370" y1="250" x2="370" y2="400" stroke="#FBBF24" stroke-width="3"/>
  <line x1="390" y1="280" x2="390" y2="370" stroke="#F97316" stroke-width="3" opacity="0.8"/>
  <line x1="410" y1="260" x2="410" y2="390" stroke="#FBBF24" stroke-width="3" opacity="0.9"/>
  <line x1="430" y1="300" x2="430" y2="350" stroke="#F97316" stroke-width="3" opacity="0.6"/>
  <line x1="450" y1="240" x2="450" y2="410" stroke="#F97316" stroke-width="3"/>
  <line x1="470" y1="270" x2="470" y2="380" stroke="#FBBF24" stroke-width="3" opacity="0.8"/>
  <!-- Play button -->
  <circle cx="640" cy="325" r="55" fill="#F97316" opacity="0.2"/>
  <circle cx="640" cy="325" r="40" fill="#F97316" opacity="0.8"/>
  <polygon points="628,308 628,342 664,325" fill="white"/>
  <!-- Title kinetic text -->
  <text x="600" y="580" font-family="system-ui, sans-serif" font-size="56" font-weight="900" fill="white" text-anchor="middle" letter-spacing="-1">MOTION</text>
  <text x="600" y="625" font-family="system-ui, sans-serif" font-size="22" fill="#F97316" text-anchor="middle" letter-spacing="8">GRAPHICS REEL</text>
  <rect x="460" y="640" width="280" height="3" rx="2" fill="url(#orange)" opacity="0.9"/>
